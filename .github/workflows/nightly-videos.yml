name: Weekly Video Review

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:
    inputs:
      fps:
        description: "Fixed FPS for Movie Maker rendering"
        required: false
        default: "60"
      scenario:
        description: "Optional single scenario id"
        required: false
        default: ""

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GODOT_VERSION: "4.6.2-stable"

jobs:
  render-videos:
    name: Video Lane - Scenario Movies
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Cache Godot import cache
        uses: actions/cache@v5
        with:
          path: .godot
          key: godot-import-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', '**/*.import') }}
          restore-keys: |
            godot-import-${{ runner.os }}-${{ env.GODOT_VERSION }}-

      - name: Install display dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install Godot
        run: bash scripts/setup_godot.sh

      - name: Import project
        run: bash scripts/godot_import.sh
        timeout-minutes: 10

      - name: Render weekly scenario videos
        env:
          MALLCORE_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
          FPS: ${{ github.event.inputs.fps || '60' }}
          SCENARIO: ${{ github.event.inputs.scenario || '' }}
        run: xvfb-run -a bash scripts/render_nightly_videos.sh
        timeout-minutes: 30

      - name: Upload scenario videos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-video-review-scenario-videos-${{ github.run_number }}
          path: |
            artifacts/videos/scenario/nightly/
            artifacts/logs/scenario/nightly-videos/
            artifacts/manifests/
          if-no-files-found: error
          retention-days: 14
