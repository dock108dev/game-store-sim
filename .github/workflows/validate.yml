name: PR and Main Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GODOT_VERSION: "4.6.2-stable"
  MALLCORE_ARTIFACT_DIR: ${{ github.workspace }}/artifacts

jobs:
  static-repo-guards:
    name: Static Lane - Repo Guards
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Run static repo guards
        run: bash scripts/validate_static_repo_guards.sh

  gdscript-lint:
    name: Static Lane - GDScript Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.*"

      - name: Run gdlint
        run: gdlint game/

  resource-integrity:
    name: Scene Lane - Resource and Autoload Integrity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Cache Godot import cache
        uses: actions/cache@v5
        with:
          path: .godot
          key: godot-import-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', '**/*.import') }}
          restore-keys: |
            godot-import-${{ runner.os }}-${{ env.GODOT_VERSION }}-

      - name: Install Godot
        run: bash scripts/setup_godot.sh

      - name: Run resource integrity checks
        run: bash scripts/validate_resource_integrity.sh

      - name: Upload PR resource integrity artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pr-resource-integrity-artifacts-${{ github.run_number }}
          path: |
            artifacts/logs/static-validation/
            artifacts/manifests/
          if-no-files-found: warn

  full-gut-tests:
    name: Unit Lane - Full GUT Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Cache Godot import cache
        uses: actions/cache@v5
        with:
          path: .godot
          key: godot-import-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', '**/*.import') }}
          restore-keys: |
            godot-import-${{ runner.os }}-${{ env.GODOT_VERSION }}-

      - name: Install Godot
        run: bash scripts/setup_godot.sh

      - name: Import project
        run: bash scripts/godot_import.sh

      - name: Seed GUT editor environment
        run: |
          godot --path "$GITHUB_WORKSPACE" --headless \
            --script res://tests/setup_gut_env.gd 2>/dev/null || true

      - name: Run full GUT tests
        run: bash scripts/run_godot_tests.sh

      - name: Run fresh install smoke
        run: bash scripts/run_fresh_install_smoke.sh

      - name: Upload PR/main GUT artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pr-main-gut-artifacts-${{ github.run_number }}
          path: |
            artifacts/logs/gut/
            artifacts/logs/scenario/
            artifacts/reports/scenario/
            artifacts/screenshots/scenario/
            artifacts/manifests/
          if-no-files-found: warn
