name: Weekly Scenario Review

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GODOT_VERSION: "4.6.2-stable"
  MALLCORE_ARTIFACT_DIR: ${{ github.workspace }}/artifacts

jobs:
  interaction-audit:
    name: Scene and Flow Lane - Interaction Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Cache Godot import cache
        uses: actions/cache@v5
        with:
          path: .godot
          key: godot-import-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', '**/*.import') }}
          restore-keys: |
            godot-import-${{ runner.os }}-${{ env.GODOT_VERSION }}-

      - name: Install Godot
        run: bash scripts/setup_godot.sh

      - name: Import project
        run: bash scripts/godot_import.sh

      - name: Run interaction audit
        run: bash tests/audit_run.sh

      - name: Upload weekly interaction audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-interaction-audit-artifacts-${{ github.run_number }}
          path: |
            docs/audits/
            artifacts/logs/scenario/
            artifacts/reports/scenario/
            artifacts/screenshots/scenario/
            artifacts/manifests/
          if-no-files-found: warn

  visual-snapshot-review:
    name: Visual Snapshot Lane - Soft Review
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Cache Godot import cache
        uses: actions/cache@v5
        with:
          path: .godot
          key: godot-import-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', '**/*.import') }}
          restore-keys: |
            godot-import-${{ runner.os }}-${{ env.GODOT_VERSION }}-

      - name: Install display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri

      - name: Install Godot
        run: bash scripts/setup_godot.sh

      - name: Import project
        run: bash scripts/godot_import.sh

      - name: Install visual diff dependencies
        run: python3 -m pip install pillow

      - name: Run soft visual snapshot sweep
        run: bash scripts/run_store_visual_sweep.sh

      - name: Upload weekly visual snapshot artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-visual-snapshot-artifacts-${{ github.run_number }}
          path: |
            artifacts/visual_sweep/
            artifacts/screenshots/visual_sweep/
            artifacts/reports/visual_sweep/
            artifacts/manifests/
          if-no-files-found: warn

  soak-review:
    name: Soak Lane - Long Day Scenario
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Cache Godot import cache
        uses: actions/cache@v5
        with:
          path: .godot
          key: godot-import-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', '**/*.import') }}
          restore-keys: |
            godot-import-${{ runner.os }}-${{ env.GODOT_VERSION }}-

      - name: Install Godot
        run: bash scripts/setup_godot.sh

      - name: Import project
        run: bash scripts/godot_import.sh

      - name: Run long day soak scenario
        run: |
          set -euo pipefail
          mkdir -p artifacts/logs/scenario
          bash scripts/godot_exec.sh --path "$GITHUB_WORKSPACE" --headless -- \
            --test-mode \
            --scenario=long_day_soak \
            --seed=weekly_long_day_soak \
            --fresh-save=weekly_long_day_soak \
            --exit-on-complete \
            --speed=6x \
            2>&1 | tee artifacts/logs/scenario/weekly-long-day-soak.log

      - name: Upload weekly soak artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-soak-artifacts-${{ github.run_number }}
          path: |
            artifacts/logs/scenario/
            artifacts/reports/scenario/
            artifacts/screenshots/scenario/
            artifacts/manifests/
          if-no-files-found: warn
